[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv   ; app besar (TLS + MQTT + inti sensor); tanpa antrean offline di flash
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial lewat USB bawaan C3

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.3
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit BusIO
