[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; app besar (TLS + MQTT + inti sensor); tanpa antrean offline di flash

monitor_speed = 115200
upload_speed = 115200   ; ESP baru gagal pada 460800/921600 (noise serial)

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.3
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit BusIO
