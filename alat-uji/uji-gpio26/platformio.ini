; Proyek uji kecil: hanya ESP32, memaksa GPIO26 HIGH untuk cek tegangan 3,3 V dengan multimeter.
; Terpisah dari firmware utama di ../../src. Build: pio run -d alat-uji/uji-gpio26

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; ESP baru gagal pada 460800/921600 (noise serial)
