; Proyek uji kecil: GPIO25 (relay NAIK) ditahan HIGH terus, tanpa sensor, LCD, buzzer, Wi-Fi.
; Terpisah dari firmware utama. Build: pio run -d alat-uji/uji-gpio25

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; ESP baru gagal pada 460800/921600 (noise serial)
