; Proyek uji kecil: hanya ESP32 + sensor CO2 MH-Z19C. Mencetak jawaban mentah sensor dan mencoba dua arah TX/RX.
; Build: pio run -d alat-uji/uji-mhz19c

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; ESP baru gagal pada 460800/921600 (noise serial)
