; Proyek uji kecil: hanya ESP32 + kaki PWM sensor CO2 MH-Z19C (tanpa UART). Untuk cek apakah sensor masih hidup bila jalur TX/RX rusak.
; Build: pio run -d alat-uji/uji-mhz19c-pwm

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; ESP baru gagal pada 460800/921600 (noise serial)
