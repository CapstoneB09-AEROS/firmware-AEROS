<text x="56" y="772" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">Terminal 5 = +12 V dari aki lewat fuse. Arus koil (merah): +12 V -&gt; koil -&gt; kolektor -&gt; emitor -&gt; GND. Arus basis (biru): GPIO -&gt; 470 Ω -&gt; basis -&gt; emitor, sekitar 5 mA.</text>
<text x="56" y="792" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a40e26" font-weight="bold">GPIO LOW: transistor mati, relay lepas, dioda hanya meredam lonjakan saat relay lepas. GPIO25 dan GPIO26 TIDAK BOLEH HIGH bersamaan.</text></svg>