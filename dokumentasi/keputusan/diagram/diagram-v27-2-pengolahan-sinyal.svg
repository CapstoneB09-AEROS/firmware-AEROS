<text x="644.0" y="426.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">Kadar CO<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<text x="644.0" y="444.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">(tanpa filter)</text>
