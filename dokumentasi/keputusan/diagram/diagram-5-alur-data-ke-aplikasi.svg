<text x="40" y="1290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Kunci: ESP32 memutuskan alarm dan menggerakkan aktuator SENDIRI (langkah 1 sampai 4).</text>
<text x="40" y="1306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Pengiriman (langkah 5 sampai 13) berjalan di tugas lain, jadi internet mati tidak menghentikan alarm.</text>
<text x="40" y="1322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Data hanya dihapus dari ESP setelah database membalas (langkah 12 dan 13). Pesan ganda ditolak lewat nonce.</text>
