<text x="500.0" y="455.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">kriteria "naik lagi"?</text>
<text x="500.0" y="473.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">[B6]</text>
<rect x="40.0" y="545.0" width="300" height="130" fill="#fad7ac" stroke="#b46504" stroke-width="1.6"/>
<text x="190.0" y="579.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">faseCO = SUMBER_LUAR</text>
<text x="190.0" y="597.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">CO naik lagi: sumber luar</text>
<text x="190.0" y="615.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">jendela TUTUP dan KUNCI</text>
<text x="190.0" y="633.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">(tidak menguji ulang)</text>
<text x="190.0" y="651.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">(hasil tidak jelas: usulan sama) [B6]</text>
<rect x="355.0" y="565.0" width="290" height="90" fill="#fff2cc" stroke="#b8922a" stroke-width="1.6"/>
