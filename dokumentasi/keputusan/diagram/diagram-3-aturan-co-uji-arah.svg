<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1300" viewBox="0 0 1250 1300"><defs><marker id="panah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="625.0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">Diagram 3. Aturan CO: uji arah dan pemulihan</text><ellipse cx="500" cy="70" rx="130.0" ry="22.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="500.0" y="75.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">ATURAN CO (lanjutan)</text>
