<text x="500.0" y="615.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">CO turun: jendela</text>
<text x="500.0" y="633.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">tetap terbuka</text>
<rect x="775.0" y="280.0" width="250" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="900.0" y="310.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">waktuUji = waktuUji + 1 detik</text>
