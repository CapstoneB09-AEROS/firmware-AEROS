<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1200" font-family="Inter, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB020"/>
    </marker>
  </defs>
  <rect width="1040" height="1200" rx="24" fill="#0B1F33"/>

  <!-- ===== BAND 1: DI ALAT ===== -->
  <rect x="20" y="20" width="1000" height="640" rx="20" fill="none" stroke="#2EC4B6" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="45" y="62" font-size="28" font-weight="800" fill="#2EC4B6">DI ALAT · tanpa internet</text>

  <rect x="60" y="85" width="440" height="90" rx="16" fill="#12304D"/>
  <text x="280" y="125" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Sensor CO2</text>
  <text x="280" y="158" font-size="24" text-anchor="middle" fill="#FFB020">MH-Z19C (NDIR)</text>
  <rect x="540" y="85" width="440" height="90" rx="16" fill="#12304D"/>
  <text x="760" y="125" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Sensor CO</text>
  <text x="760" y="158" font-size="24" text-anchor="middle" fill="#FFB020">MiCS-5524 + ADS1115</text>

  <line x1="280" y1="175" x2="280" y2="233" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <line x1="760" y1="175" x2="760" y2="233" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="60" y="235" width="920" height="100" rx="16" fill="#12304D" stroke="#FFB020" stroke-width="5"/>
  <text x="520" y="278" font-size="32" font-weight="800" text-anchor="middle" fill="#FFFFFF">ESP32 memutuskan</text>
  <text x="520" y="314" font-size="24" text-anchor="middle" fill="#FFFFFF">baca tiap 1 detik · filter SMA 6 · cek ambang</text>

  <line x1="185" y1="335" x2="185" y2="398" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <line x1="520" y1="335" x2="520" y2="398" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <line x1="855" y1="335" x2="855" y2="398" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="40" y="400" width="290" height="140" rx="16" fill="#12304D"/>
  <text x="185" y="441" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Buzzer + LCD</text>
  <text x="185" y="481" font-size="22" text-anchor="middle" fill="#FFB020">waspada 3 bip pendek</text>
  <text x="185" y="514" font-size="22" text-anchor="middle" fill="#E63946">bahaya 1 bip panjang</text>

  <rect x="375" y="400" width="290" height="140" rx="16" fill="#12304D"/>
  <text x="520" y="441" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Relay jendela</text>
  <text x="520" y="481" font-size="22" text-anchor="middle" fill="#E63946">CO2 bahaya: turun 1,5 s</text>
  <text x="520" y="514" font-size="22" text-anchor="middle" fill="#2EC4B6">CO2 aman: naik 5 s</text>

  <rect x="710" y="400" width="290" height="140" rx="16" fill="#12304D"/>
  <text x="855" y="441" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Paket data</text>
  <text x="855" y="481" font-size="22" text-anchor="middle" fill="#FFB020">dikirim tiap 5 detik</text>
  <text x="855" y="514" font-size="22" text-anchor="middle" fill="#FFFFFF">tanda tangan HMAC</text>

  <rect x="40" y="570" width="625" height="70" rx="14" fill="none" stroke="#FFB020" stroke-width="4"/>
  <text x="352" y="600" font-size="24" font-weight="800" text-anchor="middle" fill="#FFB020">1,3 detik</text>
  <text x="352" y="628" font-size="22" text-anchor="middle" fill="#FFFFFF">dari ambang terlewati sampai bunyi dan sinyal jendela</text>

  <!-- ===== BAND 2: CLOUD ===== -->
  <line x1="855" y1="540" x2="855" y2="778" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <rect x="20" y="690" width="1000" height="300" rx="20" fill="none" stroke="#7F93A8" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="45" y="732" font-size="28" font-weight="800" fill="#B8C7D6">KE CLOUD · butuh internet</text>

  <rect x="710" y="780" width="290" height="120" rx="16" fill="#12304D"/>
  <text x="855" y="824" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">HiveMQ Cloud</text>
  <text x="855" y="858" font-size="22" text-anchor="middle" fill="#FFB020">jalur TLS</text>
  <text x="855" y="884" font-size="22" text-anchor="middle" fill="#FFFFFF">perantara pesan</text>

  <line x1="710" y1="840" x2="667" y2="840" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="375" y="780" width="290" height="120" rx="16" fill="#12304D"/>
  <text x="520" y="824" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Worker</text>
  <text x="520" y="858" font-size="22" text-anchor="middle" fill="#FFB020">cek tanda tangan</text>
  <text x="520" y="884" font-size="22" text-anchor="middle" fill="#FFFFFF">simpan, balas ACK</text>

  <line x1="375" y1="840" x2="332" y2="840" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="40" y="780" width="290" height="120" rx="16" fill="#12304D"/>
  <text x="185" y="824" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Supabase</text>
  <text x="185" y="858" font-size="22" text-anchor="middle" fill="#FFB020">peringatan menaut</text>
  <text x="185" y="884" font-size="22" text-anchor="middle" fill="#FFFFFF">ke bacaan sensor</text>

  <rect x="375" y="925" width="625" height="45" rx="12" fill="none" stroke="#FFB020" stroke-width="4"/>
  <text x="687" y="956" font-size="22" text-anchor="middle" fill="#FFFFFF"><tspan font-weight="800" fill="#FFB020">1,45 detik</tspan> tunda simpan ke database (median)</text>

  <!-- ===== BAND 3: PONSEL ===== -->
  <line x1="185" y1="900" x2="185" y2="1038" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <rect x="40" y="1040" width="960" height="130" rx="16" fill="#12304D" stroke="#FFB020" stroke-width="5"/>
  <text x="520" y="1086" font-size="22" font-weight="800" text-anchor="middle" fill="#FFB020">DI PONSEL</text>
  <text x="520" y="1126" font-size="32" font-weight="800" text-anchor="middle" fill="#FFFFFF">Aplikasi Flutter</text>
  <text x="520" y="1158" font-size="24" text-anchor="middle" fill="#FFFFFF">nilai CO dan CO2 · peringatan · riwayat</text>
</svg>
