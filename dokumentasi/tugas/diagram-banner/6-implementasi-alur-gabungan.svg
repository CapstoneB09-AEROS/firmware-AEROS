<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 940" font-family="Inter, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D6E2EE"/>
    </marker>
  </defs>
  <rect width="1900" height="940" rx="24" fill="#0B1F33"/>

  <!-- ===== LANE: warna = sistem ===== -->
  <!-- Perangkat keras -->
  <rect x="190" y="20" width="1690" height="210" rx="14" fill="none" stroke="#F2B134" stroke-width="4"/>
  <rect x="20" y="20" width="160" height="210" rx="14" fill="#F2B134"/>
  <text x="100" y="112" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">PERANGKAT</text>
  <text x="100" y="144" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">KERAS</text>
  <!-- Firmware -->
  <rect x="190" y="260" width="1690" height="280" rx="14" fill="none" stroke="#4EA8DE" stroke-width="4"/>
  <rect x="20" y="260" width="160" height="280" rx="14" fill="#4EA8DE"/>
  <text x="100" y="388" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">FIRMWARE</text>
  <text x="100" y="420" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">ESP32</text>
  <!-- Cloud -->
  <rect x="190" y="570" width="1690" height="180" rx="14" fill="none" stroke="#A78BFA" stroke-width="4"/>
  <rect x="20" y="570" width="160" height="180" rx="14" fill="#A78BFA"/>
  <text x="100" y="670" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">CLOUD</text>
  <!-- Aplikasi -->
  <rect x="190" y="780" width="1690" height="140" rx="14" fill="none" stroke="#2EC4B6" stroke-width="4"/>
  <rect x="20" y="780" width="160" height="140" rx="14" fill="#2EC4B6"/>
  <text x="100" y="858" font-size="22" font-weight="800" text-anchor="middle" fill="#0B1F33">APLIKASI</text>

  <!-- ===== PERANGKAT KERAS ===== -->
  <rect x="200" y="60" width="270" height="130" rx="14" fill="#12304D" stroke="#F2B134" stroke-width="4"/>
  <text x="335" y="98" font-size="25" font-weight="800" text-anchor="middle" fill="#FFFFFF">Sensor CO2 dan CO</text>
  <text x="335" y="134" font-size="22" text-anchor="middle" fill="#D6E2EE">MH-Z19C · MiCS-5524</text>
  <text x="335" y="162" font-size="22" text-anchor="middle" fill="#D6E2EE">+ ADS1115</text>

  <rect x="1220" y="60" width="270" height="130" rx="14" fill="#12304D" stroke="#F2B134" stroke-width="4"/>
  <text x="1355" y="98" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Buzzer + LCD</text>
  <text x="1355" y="134" font-size="22" text-anchor="middle" fill="#D6E2EE">waspada 3 bip pendek</text>
  <text x="1355" y="162" font-size="22" text-anchor="middle" fill="#D6E2EE">bahaya 1 bip panjang</text>

  <rect x="1560" y="60" width="270" height="130" rx="14" fill="#12304D" stroke="#F2B134" stroke-width="4"/>
  <text x="1695" y="98" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Relay jendela</text>
  <text x="1695" y="134" font-size="22" text-anchor="middle" fill="#D6E2EE">bahaya: turun 1,5 s</text>
  <text x="1695" y="162" font-size="22" text-anchor="middle" fill="#D6E2EE">aman: naik 5 s</text>

  <!-- catatan waktu -->
  <rect x="540" y="75" width="640" height="100" rx="14" fill="none" stroke="#B8C7D6" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="860" y="116" font-size="30" font-weight="800" text-anchor="middle" fill="#FFFFFF">1,3 detik</text>
  <text x="860" y="152" font-size="22" text-anchor="middle" fill="#D6E2EE">dari ambang terlewati sampai bunyi dan sinyal jendela</text>

  <!-- ===== FIRMWARE ===== -->
  <rect x="540" y="320" width="270" height="140" rx="14" fill="#12304D" stroke="#4EA8DE" stroke-width="4"/>
  <text x="675" y="356" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Baca sensor</text>
  <text x="675" y="392" font-size="22" text-anchor="middle" fill="#D6E2EE">tiap 1 detik</text>
  <text x="675" y="420" font-size="22" text-anchor="middle" fill="#D6E2EE">filter SMA 6</text>
  <text x="675" y="448" font-size="22" text-anchor="middle" fill="#D6E2EE">(pemanasan 180 detik)</text>

  <polygon points="880,390 1015,305 1150,390 1015,475" fill="#12304D" stroke="#4EA8DE" stroke-width="4"/>
  <text x="1015" y="386" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Gas melewati</text>
  <text x="1015" y="416" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">ambang?</text>

  <rect x="1220" y="305" width="270" height="170" rx="14" fill="#12304D" stroke="#4EA8DE" stroke-width="4"/>
  <text x="1355" y="342" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Tentukan level</text>
  <text x="1355" y="378" font-size="22" text-anchor="middle" fill="#D6E2EE">waspada: CO2 ≥ 2.500</text>
  <text x="1355" y="406" font-size="22" text-anchor="middle" fill="#D6E2EE">CO ≥ 35 ppm (30 s)</text>
  <text x="1355" y="434" font-size="22" text-anchor="middle" fill="#D6E2EE">bahaya: CO2 ≥ 4.000</text>
  <text x="1355" y="462" font-size="22" text-anchor="middle" fill="#D6E2EE">CO ≥ 87 ppm</text>

  <polygon points="1560,390 1695,305 1830,390 1695,475" fill="#12304D" stroke="#4EA8DE" stroke-width="4"/>
  <text x="1695" y="386" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Kembali</text>
  <text x="1695" y="416" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">aman?</text>
  <text x="1525" y="526" font-size="22" text-anchor="middle" fill="#D6E2EE">aman: CO2 &lt; 2.500 selama 10 s · CO &lt; 30 ppm selama 60 s</text>

  <!-- ===== CLOUD ===== -->
  <rect x="540" y="600" width="270" height="120" rx="14" fill="#12304D" stroke="#A78BFA" stroke-width="4"/>
  <text x="675" y="638" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Kirim paket</text>
  <text x="675" y="672" font-size="22" text-anchor="middle" fill="#D6E2EE">tiap 5 detik</text>
  <text x="675" y="700" font-size="22" text-anchor="middle" fill="#D6E2EE">HMAC + TLS</text>

  <rect x="880" y="600" width="270" height="120" rx="14" fill="#12304D" stroke="#A78BFA" stroke-width="4"/>
  <text x="1015" y="638" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">HiveMQ Cloud</text>
  <text x="1015" y="672" font-size="22" text-anchor="middle" fill="#D6E2EE">perantara MQTT</text>

  <rect x="1220" y="600" width="270" height="120" rx="14" fill="#12304D" stroke="#A78BFA" stroke-width="4"/>
  <text x="1355" y="638" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Worker Node.js</text>
  <text x="1355" y="672" font-size="22" text-anchor="middle" fill="#D6E2EE">cek tanda tangan</text>
  <text x="1355" y="700" font-size="22" text-anchor="middle" fill="#D6E2EE">simpan, balas ACK</text>

  <rect x="1560" y="600" width="270" height="120" rx="14" fill="#12304D" stroke="#A78BFA" stroke-width="4"/>
  <text x="1695" y="638" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Supabase</text>
  <text x="1695" y="672" font-size="22" text-anchor="middle" fill="#D6E2EE">database</text>
  <text x="1695" y="700" font-size="22" text-anchor="middle" fill="#D6E2EE">peringatan + bacaan</text>

  <!-- ===== APLIKASI ===== -->
  <rect x="1560" y="795" width="270" height="115" rx="14" fill="#12304D" stroke="#2EC4B6" stroke-width="4"/>
  <text x="1695" y="833" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF">Aplikasi Flutter</text>
  <text x="1695" y="867" font-size="22" text-anchor="middle" fill="#D6E2EE">nilai dan peringatan</text>
  <text x="1695" y="895" font-size="22" text-anchor="middle" fill="#D6E2EE">riwayat</text>

  <rect x="540" y="815" width="640" height="75" rx="14" fill="none" stroke="#B8C7D6" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="860" y="845" font-size="30" font-weight="800" text-anchor="middle" fill="#FFFFFF">1,45 detik</text>
  <text x="860" y="876" font-size="22" text-anchor="middle" fill="#D6E2EE">tunda simpan ke database (median)</text>

  <!-- ===== PANAH ===== -->
  <g fill="none" stroke="#D6E2EE" stroke-width="4" marker-end="url(#ar)">
    <!-- sensor -> baca -->
    <polyline points="335,190 335,390 538,390"/>
    <!-- baca -> keputusan -->
    <line x1="810" y1="390" x2="878" y2="390"/>
    <!-- tidak: kembali baca -->
    <polyline points="1015,305 1015,288 675,288 675,318"/>
    <!-- ya: tentukan level -->
    <line x1="1150" y1="390" x2="1218" y2="390"/>
    <!-- level -> buzzer + LCD -->
    <line x1="1355" y1="305" x2="1355" y2="192"/>
    <!-- level -> relay (turun) -->
    <polyline points="1440,305 1440,245 1650,245 1650,192"/>
    <!-- level -> kembali aman? -->
    <line x1="1490" y1="390" x2="1558" y2="390"/>
    <!-- ya: relay naik -->
    <line x1="1740" y1="333" x2="1740" y2="192"/>
    <!-- belum: kembali ke level -->
    <polyline points="1695,475 1695,495 1355,495 1355,477"/>
    <!-- baca -> kirim paket -->
    <line x1="675" y1="460" x2="675" y2="598"/>
    <!-- cloud -->
    <line x1="810" y1="660" x2="878" y2="660"/>
    <line x1="1150" y1="660" x2="1218" y2="660"/>
    <line x1="1490" y1="660" x2="1558" y2="660"/>
    <!-- supabase -> aplikasi -->
    <line x1="1695" y1="720" x2="1695" y2="793"/>
  </g>

  <!-- label panah -->
  <g font-size="22" font-weight="800" fill="#FFFFFF">
    <text x="845" y="314" text-anchor="middle">tidak</text>
    <text x="1184" y="376" text-anchor="middle">ya</text>
    <text x="1754" y="300">ya</text>
    <text x="1525" y="488" text-anchor="middle">belum</text>
  </g>
</svg>
