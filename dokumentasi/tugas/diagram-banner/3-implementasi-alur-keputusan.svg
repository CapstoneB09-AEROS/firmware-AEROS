<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 960" font-family="Inter, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB020"/>
    </marker>
  </defs>
  <rect width="1040" height="960" rx="24" fill="#0B1F33"/>

  <!-- alur umum -->
  <rect x="20" y="20" width="300" height="80" rx="16" fill="#12304D"/>
  <text x="170" y="70" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">Baca tiap 1 detik</text>
  <line x1="320" y1="60" x2="368" y2="60" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <rect x="370" y="20" width="300" height="80" rx="16" fill="#12304D"/>
  <text x="520" y="70" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">Filter SMA 6</text>
  <line x1="670" y1="60" x2="718" y2="60" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <rect x="720" y="20" width="300" height="80" rx="16" fill="#12304D"/>
  <text x="870" y="70" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">Pemanasan 180 detik</text>

  <!-- cabang ke dua jalur -->
  <polyline points="870,100 870,125 260,125 260,148" fill="none" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <polyline points="870,125 780,125 780,148" fill="none" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <!-- ===== JALUR CO2 ===== -->
  <text x="260" y="185" font-size="30" font-weight="800" text-anchor="middle" fill="#FFB020">CO2 · MH-Z19C</text>

  <rect x="40" y="210" width="440" height="90" rx="16" fill="#12304D" stroke="#2EC4B6" stroke-width="5"/>
  <text x="260" y="250" font-size="28" font-weight="800" text-anchor="middle" fill="#2EC4B6">AMAN</text>
  <text x="260" y="283" font-size="24" text-anchor="middle" fill="#FFFFFF">&lt; 2.500 ppm</text>

  <line x1="260" y1="300" x2="260" y2="358" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <text x="285" y="338" font-size="24" fill="#FFFFFF">≥ 2.500 ppm</text>

  <rect x="40" y="360" width="440" height="90" rx="16" fill="#12304D" stroke="#FFB020" stroke-width="5"/>
  <text x="260" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#FFB020">WASPADA</text>
  <text x="260" y="433" font-size="24" text-anchor="middle" fill="#FFFFFF">3 bip pendek</text>

  <line x1="260" y1="450" x2="260" y2="508" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <text x="285" y="488" font-size="24" fill="#FFFFFF">≥ 4.000 ppm</text>

  <rect x="40" y="510" width="440" height="130" rx="16" fill="#12304D" stroke="#E63946" stroke-width="5"/>
  <text x="260" y="550" font-size="28" font-weight="800" text-anchor="middle" fill="#E63946">BAHAYA</text>
  <text x="260" y="585" font-size="24" text-anchor="middle" fill="#FFFFFF">1 bip panjang</text>
  <text x="260" y="618" font-size="24" text-anchor="middle" fill="#FFFFFF">Jendela turun 1,5 detik</text>

  <line x1="260" y1="640" x2="260" y2="738" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <text x="285" y="680" font-size="24" fill="#FFFFFF">&lt; 2.500 ppm</text>
  <text x="285" y="710" font-size="24" fill="#FFFFFF">selama 10 detik</text>

  <rect x="40" y="740" width="440" height="100" rx="16" fill="#12304D" stroke="#2EC4B6" stroke-width="5"/>
  <text x="260" y="783" font-size="28" font-weight="800" text-anchor="middle" fill="#2EC4B6">AMAN LAGI</text>
  <text x="260" y="819" font-size="24" text-anchor="middle" fill="#FFFFFF">Jendela naik 5 detik</text>

  <!-- ===== JALUR CO ===== -->
  <text x="780" y="185" font-size="30" font-weight="800" text-anchor="middle" fill="#FFB020">CO · MiCS-5524</text>

  <rect x="540" y="210" width="480" height="90" rx="16" fill="#12304D" stroke="#2EC4B6" stroke-width="5"/>
  <text x="780" y="250" font-size="28" font-weight="800" text-anchor="middle" fill="#2EC4B6">AMAN</text>
  <text x="780" y="283" font-size="24" text-anchor="middle" fill="#FFFFFF">&lt; 35 ppm (estimasi)</text>

  <line x1="780" y1="300" x2="780" y2="358" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <text x="800" y="327" font-size="24" fill="#FFFFFF">≥ 35 ppm, 30 detik</text>
  <text x="800" y="352" font-size="22" fill="#B8C7D6">atau ≥ 87 ppm</text>

  <rect x="540" y="360" width="480" height="140" rx="16" fill="#12304D" stroke="#FFB020" stroke-width="5"/>
  <text x="780" y="402" font-size="28" font-weight="800" text-anchor="middle" fill="#FFB020">UJI ARAH 30 DETIK</text>
  <text x="780" y="440" font-size="24" text-anchor="middle" fill="#FFFFFF">Buka jendela</text>
  <text x="780" y="473" font-size="24" text-anchor="middle" fill="#FFFFFF">Pantau: CO turun atau naik?</text>

  <polyline points="780,500 780,530 652,530 652,578" fill="none" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>
  <polyline points="780,530 908,530 908,578" fill="none" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="540" y="580" width="225" height="140" rx="16" fill="#12304D" stroke="#2EC4B6" stroke-width="5"/>
  <text x="652" y="616" font-size="22" text-anchor="middle" fill="#B8C7D6">CO turun</text>
  <text x="652" y="652" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">SUMBER</text>
  <text x="652" y="682" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">DALAM</text>
  <text x="652" y="708" font-size="22" text-anchor="middle" fill="#2EC4B6">jendela terbuka</text>

  <rect x="795" y="580" width="225" height="140" rx="16" fill="#12304D" stroke="#E63946" stroke-width="5"/>
  <text x="908" y="616" font-size="22" text-anchor="middle" fill="#B8C7D6">CO naik</text>
  <text x="908" y="652" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">SUMBER</text>
  <text x="908" y="682" font-size="26" font-weight="800" text-anchor="middle" fill="#FFFFFF">LUAR</text>
  <text x="908" y="708" font-size="22" text-anchor="middle" fill="#E63946">tutup jendela</text>

  <polyline points="652,720 652,742 780,742 780,738" fill="none" stroke="#FFB020" stroke-width="5"/>
  <polyline points="908,720 908,742 780,742" fill="none" stroke="#FFB020" stroke-width="5"/>
  <line x1="780" y1="742" x2="780" y2="768" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <rect x="540" y="770" width="480" height="100" rx="16" fill="#12304D" stroke="#2EC4B6" stroke-width="5"/>
  <text x="780" y="813" font-size="28" font-weight="800" text-anchor="middle" fill="#2EC4B6">AMAN LAGI</text>
  <text x="780" y="849" font-size="24" text-anchor="middle" fill="#FFFFFF">&lt; 30 ppm selama 60 detik</text>

  <!-- catatan -->
  <text x="520" y="915" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Semua keputusan berjalan di ESP32, tanpa internet</text>
</svg>
