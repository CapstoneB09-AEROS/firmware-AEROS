<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" font-family="Inter, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB020"/>
    </marker>
  </defs>
  <rect width="1040" height="780" rx="24" fill="#0B1F33"/>

  <!-- 1 DETEKSI -->
  <rect x="20" y="20" width="740" height="150" rx="18" fill="#12304D"/>
  <circle cx="75" cy="95" r="34" fill="#FFB020"/><text x="75" y="108" font-size="38" font-weight="800" text-anchor="middle" fill="#0B1F33">1</text>
  <text x="130" y="68" font-size="36" font-weight="800" fill="#FFB020">DETEKSI</text>
  <text x="130" y="108" font-size="24" fill="#FFFFFF">Sensor CO2 dan CO membaca tiap 1 detik</text>
  <text x="130" y="140" font-size="24" fill="#FFFFFF">Gas yang tidak berbau dan tidak terlihat</text>
  <line x1="75" y1="170" x2="75" y2="208" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <!-- 2 PUTUSKAN -->
  <rect x="20" y="210" width="740" height="150" rx="18" fill="#12304D"/>
  <circle cx="75" cy="285" r="34" fill="#FFB020"/><text x="75" y="298" font-size="38" font-weight="800" text-anchor="middle" fill="#0B1F33">2</text>
  <text x="130" y="258" font-size="36" font-weight="800" fill="#FFB020">PUTUSKAN</text>
  <text x="130" y="298" font-size="24" fill="#FFFFFF">Peringatan bertingkat: waspada, lalu bahaya</text>
  <text x="130" y="330" font-size="24" fill="#FFFFFF">CO: uji arah, sumber dalam atau luar mobil</text>
  <line x1="75" y1="360" x2="75" y2="398" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <!-- 3 BERTINDAK -->
  <rect x="20" y="400" width="740" height="150" rx="18" fill="#12304D"/>
  <circle cx="75" cy="475" r="34" fill="#FFB020"/><text x="75" y="488" font-size="38" font-weight="800" text-anchor="middle" fill="#0B1F33">3</text>
  <text x="130" y="448" font-size="36" font-weight="800" fill="#FFB020">BERTINDAK</text>
  <text x="130" y="488" font-size="24" fill="#FFFFFF">Buzzer dan LCD memberi tahu penghuni</text>
  <text x="130" y="520" font-size="24" fill="#FFFFFF">Jendela turun lalu naik otomatis (ventilasi)</text>
  <line x1="75" y1="550" x2="75" y2="588" stroke="#FFB020" stroke-width="5" marker-end="url(#ar)"/>

  <!-- 4 LAPOR -->
  <rect x="20" y="590" width="740" height="150" rx="18" fill="#12304D"/>
  <circle cx="75" cy="665" r="34" fill="#FFB020"/><text x="75" y="678" font-size="38" font-weight="800" text-anchor="middle" fill="#0B1F33">4</text>
  <text x="130" y="638" font-size="36" font-weight="800" fill="#FFB020">LAPOR</text>
  <text x="130" y="678" font-size="24" fill="#FFFFFF">Data tiap 5 detik ke cloud</text>
  <text x="130" y="710" font-size="24" fill="#FFFFFF">Nilai dan peringatan tampil di aplikasi</text>

  <!-- label offline / online -->
  <rect x="790" y="20" width="230" height="530" rx="18" fill="none" stroke="#2EC4B6" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="905" y="250" font-size="26" font-weight="800" text-anchor="middle" fill="#2EC4B6">Berjalan di</text>
  <text x="905" y="284" font-size="26" font-weight="800" text-anchor="middle" fill="#2EC4B6">ESP32</text>
  <text x="905" y="330" font-size="24" text-anchor="middle" fill="#FFFFFF">tanpa internet</text>

  <rect x="790" y="590" width="230" height="150" rx="18" fill="none" stroke="#7F93A8" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="905" y="658" font-size="26" font-weight="800" text-anchor="middle" fill="#B8C7D6">Butuh</text>
  <text x="905" y="692" font-size="26" font-weight="800" text-anchor="middle" fill="#B8C7D6">internet</text>
</svg>
