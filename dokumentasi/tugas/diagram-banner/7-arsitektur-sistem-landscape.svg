<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1800 770" font-family="Inter, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4A5C"/>
    </marker>
  </defs>
  <rect x="0" y="60" width="1800" height="770" rx="22" fill="#FFFFFF"/>

  <!-- ===== DEVICE AEROS (biru) ===== -->
  <rect x="30" y="90" width="515" height="700" rx="16" fill="#DCEBFA"/>
  <text x="55" y="135" font-size="30" font-weight="800" fill="#1B4F8A">DEVICE AEROS</text>

  <rect x="50" y="170" width="225" height="210" rx="8" fill="#FFFFFF" stroke="#8DB8E6" stroke-width="3"/>
  <text x="162" y="206" font-size="26" font-weight="800" text-anchor="middle" fill="#14263A">Sensor CO2</text>
  <text x="162" y="236" font-size="19" font-weight="800" text-anchor="middle" fill="#1B4F8A">MH-Z19C</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="162" y="271">mengukur CO2, gas</text>
    <text x="162" y="297">dari napas yang</text>
    <text x="162" y="323">menumpuk di kabin</text>
    <text x="162" y="349">(pakai sinar inframerah)</text>
  </g>

  <rect x="300" y="170" width="225" height="210" rx="8" fill="#FFFFFF" stroke="#8DB8E6" stroke-width="3"/>
  <text x="412" y="206" font-size="26" font-weight="800" text-anchor="middle" fill="#14263A">Sensor CO</text>
  <text x="412" y="236" font-size="19" font-weight="800" text-anchor="middle" fill="#1B4F8A">MiCS-5524 + ADS1115</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="412" y="271">mengukur CO, gas</text>
    <text x="412" y="297">beracun dari knalpot</text>
    <text x="412" y="323">ADS1115 = penerjemah</text>
    <text x="412" y="349">sinyal sensor ke ESP32</text>
  </g>

  <line x1="162" y1="380" x2="162" y2="438" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>
  <line x1="412" y1="380" x2="412" y2="438" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>

  <rect x="50" y="440" width="475" height="325" rx="8" fill="#FFFFFF" stroke="#8DB8E6" stroke-width="3"/>
  <text x="287" y="492" font-size="34" font-weight="800" text-anchor="middle" fill="#14263A">ESP32</text>
  <text x="287" y="524" font-size="21" font-weight="800" text-anchor="middle" fill="#1B4F8A">otak alat AEROS</text>
  <g font-size="21" text-anchor="middle" fill="#3A4A5C">
    <text x="287" y="574">membaca kedua sensor tiap 1 detik</text>
    <text x="287" y="606">menilai udara: aman, waspada,</text>
    <text x="287" y="638">atau bahaya (dibandingkan</text>
    <text x="287" y="670">dengan batas aman)</text>
  </g>
  <text x="287" y="722" font-size="22" font-weight="800" text-anchor="middle" fill="#1B4F8A">tetap bekerja tanpa internet</text>

  <!-- ===== AKTUATOR (oranye) ===== -->
  <rect x="700" y="90" width="795" height="355" rx="16" fill="#FCE8D5"/>
  <text x="725" y="135" font-size="30" font-weight="800" fill="#A4510F">AKTUATOR</text>

  <rect x="720" y="160" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#F0B27A" stroke-width="3"/>
  <text x="895" y="195" font-size="26" font-weight="800" text-anchor="middle" fill="#14263A">Buzzer</text>
  <text x="895" y="231" font-size="20" text-anchor="middle" fill="#3A4A5C">berbunyi sebagai alarm agar</text>
  <text x="895" y="257" font-size="20" text-anchor="middle" fill="#3A4A5C">pengemudi segera sadar</text>

  <rect x="1115" y="160" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#F0B27A" stroke-width="3"/>
  <text x="1290" y="195" font-size="26" font-weight="800" text-anchor="middle" fill="#14263A">Layar LCD</text>
  <text x="1290" y="231" font-size="20" text-anchor="middle" fill="#3A4A5C">menampilkan kadar gas</text>
  <text x="1290" y="257" font-size="20" text-anchor="middle" fill="#3A4A5C">dan status udara</text>

  <rect x="720" y="300" width="350" height="125" rx="8" fill="#FFFFFF" stroke="#F0B27A" stroke-width="3"/>
  <text x="895" y="334" font-size="25" font-weight="800" text-anchor="middle" fill="#14263A">Saklar relay (PN2222A)</text>
  <text x="895" y="369" font-size="20" text-anchor="middle" fill="#3A4A5C">penghubung listrik otomatis</text>
  <text x="895" y="395" font-size="20" text-anchor="middle" fill="#3A4A5C">untuk motor jendela</text>

  <line x1="1070" y1="362" x2="1113" y2="362" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="1115" y="300" width="350" height="125" rx="8" fill="#FFFFFF" stroke="#F0B27A" stroke-width="3"/>
  <text x="1290" y="334" font-size="26" font-weight="800" text-anchor="middle" fill="#14263A">Jendela mobil</text>
  <text x="1290" y="369" font-size="20" text-anchor="middle" fill="#3A4A5C">turun sendiri saat bahaya,</text>
  <text x="1290" y="395" font-size="20" text-anchor="middle" fill="#3A4A5C">naik lagi saat udara aman</text>

  <!-- ===== CLOUD (ungu) ===== -->
  <rect x="700" y="470" width="795" height="320" rx="16" fill="#E7E0FA"/>
  <text x="725" y="515" font-size="30" font-weight="800" fill="#5B3FB0">CLOUD</text>

  <rect x="720" y="550" width="225" height="205" rx="8" fill="#FFFFFF" stroke="#B7A4F0" stroke-width="3"/>
  <text x="832" y="592" font-size="25" font-weight="800" text-anchor="middle" fill="#14263A">HiveMQ Cloud</text>
  <text x="832" y="624" font-size="19" font-weight="800" text-anchor="middle" fill="#5B3FB0">kurir pesan</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="832" y="662">meneruskan data</text>
    <text x="832" y="688">dari alat ke server</text>
  </g>

  <line x1="945" y1="652" x2="983" y2="652" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="985" y="550" width="225" height="205" rx="8" fill="#FFFFFF" stroke="#B7A4F0" stroke-width="3"/>
  <text x="1097" y="592" font-size="25" font-weight="800" text-anchor="middle" fill="#14263A">Worker Node.js</text>
  <text x="1097" y="624" font-size="19" font-weight="800" text-anchor="middle" fill="#5B3FB0">penjaga data</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="1097" y="662">memastikan data asli</text>
    <text x="1097" y="688">dari alat, lalu</text>
    <text x="1097" y="714">menyimpannya</text>
  </g>

  <line x1="1210" y1="652" x2="1248" y2="652" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="1250" y="550" width="225" height="205" rx="8" fill="#FFFFFF" stroke="#B7A4F0" stroke-width="3"/>
  <text x="1362" y="592" font-size="25" font-weight="800" text-anchor="middle" fill="#14263A">Supabase</text>
  <text x="1362" y="624" font-size="19" font-weight="800" text-anchor="middle" fill="#5B3FB0">database</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="1362" y="662">tempat menyimpan</text>
    <text x="1362" y="688">bacaan sensor dan</text>
    <text x="1362" y="714">riwayat peringatan</text>
  </g>

  <!-- ===== SOFTWARE (hijau-biru) ===== -->
  <rect x="1515" y="470" width="265" height="320" rx="16" fill="#D8F1EC"/>
  <text x="1540" y="515" font-size="30" font-weight="800" fill="#0F6B5E">SOFTWARE</text>
  <rect x="1535" y="550" width="225" height="205" rx="8" fill="#FFFFFF" stroke="#7FD0C2" stroke-width="3"/>
  <text x="1647" y="592" font-size="24" font-weight="800" text-anchor="middle" fill="#14263A">Aplikasi Flutter</text>
  <text x="1647" y="624" font-size="19" font-weight="800" text-anchor="middle" fill="#0F6B5E">aplikasi di HP</text>
  <g font-size="19" text-anchor="middle" fill="#3A4A5C">
    <text x="1647" y="662">menampilkan kadar</text>
    <text x="1647" y="688">gas, peringatan,</text>
    <text x="1647" y="714">dan riwayat</text>
  </g>

  <line x1="1475" y1="652" x2="1533" y2="652" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)"/>

  <!-- ===== WAKTU TERUKUR ===== -->
  <rect x="1515" y="90" width="265" height="355" rx="16" fill="#EEF1F4"/>
  <text x="1540" y="135" font-size="25" font-weight="800" fill="#3A4A5C">WAKTU TERUKUR</text>
  <text x="1540" y="195" font-size="36" font-weight="800" fill="#14263A">1,3 detik</text>
  <g font-size="20" fill="#3A4A5C">
    <text x="1540" y="226">dari gas melewati batas</text>
    <text x="1540" y="251">sampai alarm bunyi dan</text>
    <text x="1540" y="276">sinyal jendela terkirim</text>
  </g>
  <text x="1540" y="338" font-size="36" font-weight="800" fill="#14263A">1,45 detik</text>
  <g font-size="20" fill="#3A4A5C">
    <text x="1540" y="369">jeda sampai data</text>
    <text x="1540" y="394">tersimpan di database</text>
    <text x="1540" y="419">(nilai tengah)</text>
  </g>

  <!-- ===== PANAH ANTAR-SISTEM ===== -->
  <g fill="none" stroke="#3A4A5C" stroke-width="4" marker-end="url(#ar)">
    <polyline points="525,500 680,500 680,230 698,230"/>
    <line x1="525" y1="652" x2="718" y2="652"/>
  </g>
  <g font-size="20" font-weight="800" fill="#14263A" text-anchor="middle">
    <text x="605" y="400">keputusan</text>
    <text x="605" y="426">di alat, tanpa</text>
    <text x="605" y="452">internet</text>
    <text x="620" y="568">lewat Wi-Fi</text>
    <text x="620" y="594">(terenkripsi)</text>
    <text x="620" y="620">tiap 5 detik</text>
  </g>
</svg>
