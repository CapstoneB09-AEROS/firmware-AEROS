<text x="660.0" y="367.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">Worker menerima:</text>
<text x="660.0" y="385.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">Realtime INSERT atau</text>
<text x="660.0" y="403.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">polling tiap 15 detik</text>
