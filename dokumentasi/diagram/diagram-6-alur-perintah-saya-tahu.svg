<text x="40" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Kunci: "Saya Tahu" hanya mematikan bunyi bila alert_id perintah SAMA dengan alarm yang sedang aktif di ESP32.</text>
<text x="40" y="1316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Perintah lama atau milik alarm lain tidak bisa mematikan alarm baru. Perintah dibuat sendiri oleh worker, tidak diterima dari luar.</text>
<text x="40" y="1332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Syarat cocok: alert_logs.id harus sama dengan event_id dari ESP32 (keputusan 27 Okt, pseudocode 2.8.8).</text>
