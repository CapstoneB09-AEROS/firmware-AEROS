<text x="1190.0" y="814.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">dan umur &lt;= 120 detik?</text>
<rect x="825.0" y="769.0" width="200" height="62" fill="#eeeeee" stroke="#666666" stroke-width="1.6"/>
<text x="925.0" y="796.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">Diabaikan, dicatat</text>
<text x="925.0" y="814.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">di serial</text>
<polygon points="1455,870.0 1581.0,940 1455,1010.0 1329.0,940" fill="#dae8fc" stroke="#5b7fb5" stroke-width="1.6"/>
