<text x="660.0" y="525.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">perangkat ini, belum</text>
<text x="660.0" y="543.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">selesai?</text>
